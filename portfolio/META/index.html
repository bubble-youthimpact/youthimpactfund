<style>
/* Layout: one centered 880px column on a pale blue-grey ground; blue is the only brand color. Single light theme by choice (matches the live site). */
:root {
  color-scheme: light only;
  --bg: #EFF3F8;
  --surface: #FFFFFF;
  --ink: #111318;
  --ink-2: #3C4250;
  --muted: #6E7686;
  --line: #DCE2EA;
  --blue: #003EDD;
  --blue-ink: #FFFFFF;
  --blue-soft: #D3E3FA;
  --chip: #E9EDF3;
  --orange: #F07A3C;
  --gain: #F04452;      /* Korean market convention: up = red */
  --loss: #12A95E;      /*                           down = green */
  --gain-on-blue: #FF6B6B;
  --loss-on-blue: #3BE37A;
  --font: "Manrope", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Noto Serif", Georgia, "Times New Roman", serif;
  --w: 1280px;
  --r: 22px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--font); -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
html, body { color-scheme: light only; }
input, textarea, select { color-scheme: light only; background-color: #fff; color: var(--ink); font: inherit; }
input::placeholder, textarea::placeholder { color: #8A92A1; opacity: 1; }
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, textarea:-webkit-autofill {
  -webkit-text-fill-color: var(--ink); -webkit-box-shadow: 0 0 0 1000px #fff inset; caret-color: var(--ink); transition: background-color 9999s; }
.comment input, .composer textarea, .search input { background-color: transparent; }
.search input { background-color: var(--surface); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.wrap {
  width: 100%; max-width: calc(var(--w) + 32px); margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); }
.nav { display: flex; align-items: center; gap: 24px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; line-height: 1.2; flex: none; }
.brand img, .brand svg { width: auto; height: 32px; }
.menu { display: flex; gap: 26px; margin-left: auto; font-size: 14px; font-weight: 500; }
.menu a { padding: 6px 0; color: var(--ink-2); border-bottom: 2px solid transparent; }
.menu a:hover { color: var(--ink); }
.menu a[aria-current="page"] { color: var(--blue); border-color: var(--blue); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 22px; border-radius: 999px; font-weight: 500; font-size: 14px; transition: transform .15s, background .15s; }
.btn:active { transform: scale(.97); }
.btn-blue { background: var(--blue); color: var(--blue-ink); }
.btn-blue:hover { background: #0034BC; }
.btn-white { background: var(--surface); color: var(--blue); }
.btn-outline { height: 30px; padding: 0 13px; border: 1px solid var(--ink); font-size: 12px; }
.btn-outline:hover { background: var(--ink); color: var(--surface); }
#acctSlot > .btn-blue { margin-left: 28px; }
.burger { display: none; width: 42px; height: 42px; border-radius: 12px; margin-left: 8px; position: relative; flex: none; }
.burger:hover { background: var(--chip); }
.burger span { position: absolute; left: 11px; width: 20px; height: 2px; border-radius: 2px; background: var(--ink); transition: transform .25s, opacity .2s, top .25s; }
.burger span:nth-child(1) { top: 14px; } .burger span:nth-child(2) { top: 20px; } .burger span:nth-child(3) { top: 26px; }
.burger[aria-expanded="true"] span:nth-child(1) { top: 20px; transform: rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { top: 20px; transform: rotate(-45deg); }
.menu-acct { display: none; }
@media (max-width: 900px) {
  .burger { display: block; }
  #acctSlot { display: none; }
  .burger { margin-left: auto; }
  .menu { position: absolute; top: 100%; left: 0; right: 0; height: calc(100dvh - 64px - env(safe-area-inset-top, 0px)); margin: 0; flex-direction: column; gap: 0; background: var(--bg);
    padding: 12px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); overflow-y: auto;
    opacity: 0; visibility: hidden; transform: translateY(-8px); transition: opacity .2s, transform .2s, visibility 0s .2s; }
  .menu.open { opacity: 1; visibility: visible; transform: none; transition: opacity .2s, transform .2s; }
  .menu > a { display: flex; justify-content: space-between; align-items: center; padding: 16px 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); border-bottom: 1px solid var(--line); }
  .menu > a::after { content: "→"; font-size: 18px; color: var(--muted); font-weight: 400; transition: transform .15s; }
  .menu > a:hover::after { transform: translateX(3px); color: var(--blue); }
  .menu > a[aria-current="page"] { color: var(--blue); border-color: var(--line); }
  .menu > a[aria-current="page"]::after { color: var(--blue); }
  .menu-acct { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 28px; }
  .menu-acct .btn { height: 48px; font-size: 15px; font-weight: 600; width: 100%; }
  .menu-acct .btn-white { box-shadow: 0 0 0 1px var(--line) inset; }
  .menu-acct a.btn { border: 0; padding: 0 22px; }
  .menu-acct .btn-blue, .menu-acct .btn-blue:hover { color: #fff; }
  .menu-acct .btn-white, .menu-acct .btn-white:hover { color: var(--blue); }
  .menu-acct .me { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 16px; padding: 14px 16px; }
  .menu-acct .me .avatar { width: 40px; height: 40px; color: #fff; font-size: 14px; }
  .menu-acct .me b { display: block; font-size: 15px; } .menu-acct .me span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  body.menu-open { overflow: hidden; }
  #acctSlot > .btn-blue { margin-left: 0; height: 38px; padding: 0 16px; }
  .acct { margin-left: 0; }
  .acct-btn .nm { display: none; }
  .acct-btn { padding: 0 5px; }
}
@media (max-width: 900px) and (prefers-reduced-motion: reduce) { .menu, .menu.open { transition: none; transform: none; } }

/* ---------- shared ---------- */
main { flex: 1; padding-block: 28px 96px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border-radius: var(--r); padding: 36px; }

.eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.section-title { font-size: 26px; font-weight: 600; margin: 48px 0 24px; }
.empty { padding: 48px 24px; text-align: center; color: var(--muted); background: var(--surface); border-radius: var(--r); }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.back { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; margin: 8px 0 22px; border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13.5px; font-weight: 600; box-shadow: 0 0 0 1px var(--line) inset; transition: color .15s, box-shadow .15s, background .15s; }

.up { color: var(--gain); } .down { color: var(--loss); }
.placeholder-img { background: linear-gradient(135deg, var(--blue-soft), #EDF2FB); color: var(--blue); display: grid; place-items: center; font-weight: 700; }

/* ---------- home ---------- */
.hero { background: var(--blue-soft); border-radius: var(--r); padding: 40px 34px; display: grid; grid-template-columns: 1fr 220px; align-items: center; gap: 24px; }
.hero h1 { font-size: clamp(32px, 6vw, 46px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
.hero p { margin: 14px 0 26px; }
.hero .row { display: flex; gap: 14px; flex-wrap: wrap; }

.about-row .art img { width: 100%; max-width: 200px; }
.about-row { display: grid; grid-template-columns: 200px 1fr; gap: 40px; align-items: center; }
.about-row h2, .port-row h2 { font-size: 26px; font-weight: 700; }

.cards-wrap { position: relative; }

.view-more a:hover { background: var(--chip); color: var(--blue); }

/* home: hero, holdings, funds */
.home-hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 40px; align-items: center; margin-top: 28px; }
.home-hero .eyebrow { color: var(--blue); font-weight: 600; font-size: 12px; }

.home-hero p { color: var(--ink-2); font-size: 16px; line-height: 1.65; margin-top: 18px; max-width: 560px; }
.home-hero .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.hero-art2 { position: relative; aspect-ratio: 1; max-width: 460px; width: 100%; justify-self: center; display: grid; place-items: center; }
.hero-art2 .glow { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle at 50% 45%, rgba(0,62,221,.22), rgba(0,62,221,.08) 45%, transparent 70%); animation: pulse 6s ease-in-out infinite; }
.hero-art2 .ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(0,62,221,.22); }
.hero-art2 .r1 { inset: 12%; animation: spin 60s linear infinite; }
.hero-art2 .r2 { inset: 0; border-style: solid; border-color: rgba(0,62,221,.08); }

@keyframes float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-14px) rotate(1deg); } }
@keyframes shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.82); opacity: .6; } }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: .8; } }
@media (prefers-reduced-motion: reduce) { .hero-art2 img, .hero-art2 .shadow, .hero-art2 .glow, .hero-art2 .r1 { animation: none; } }
.stack > .ab-stats { margin-top: 24px; }

/* home: reports + campaigns */

.stack > .sec-title { margin: 40px 0 2px; }

/* ---------- portfolio ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.kpi .dir { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 9px; white-space: nowrap; align-self: flex-start; }
.kpi .dir.up { background: #FDECEE; } .kpi .dir.down { background: #E7F6EE; }
.ptable-wrap { background: var(--surface); border-radius: var(--r); overflow-x: auto; }
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 820px; }
.ptable th { text-align: right; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 14px 18px; background: #F7F9FC; border-bottom: 1px solid var(--line); white-space: nowrap; }

.ptable .co { display: flex; align-items: center; gap: 12px; }

.ptable .co b { display: block; font-weight: 600; }
.ptable .co small { display: block; color: var(--muted); font-size: 12px; white-space: normal; }
.wbar { display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; }

.ptable tfoot td { font-weight: 700; background: #F7F9FC; border-top: 1px solid var(--line); border-bottom: 0; }
.ret-pill { display: inline-block; min-width: 76px; text-align: right; font-weight: 600; }
.alloc-tabs { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ret-box { background: var(--blue); color: #fff; border-radius: var(--r); padding: 28px 30px; display: grid; grid-template-columns: minmax(0, 1.1fr) 1fr; gap: 24px; align-items: center; }
.ret-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ret-table th { text-align: left; font-size: 11px; font-weight: 500; padding-bottom: 6px; }
.ret-table td { padding: 4px 0; }
.ret-table .up { color: var(--gain-on-blue); } .ret-table .down { color: var(--loss-on-blue); }
.big-ret { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.big-ret .v { display: flex; align-items: center; gap: 16px; font-size: clamp(40px, 7vw, 64px); font-weight: 700; letter-spacing: -0.02em; }

.alloc h3 { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.alloc-row { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: center; margin-bottom: 48px; }
.alloc-row:last-child { margin-bottom: 0; }
.pie { width: 100%; max-width: 280px; }
.ltable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ltable th { background: #F2F4F7; font-weight: 500; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.ltable th + th, .ltable td + td { border-left: 1px solid var(--line); text-align: center; width: 30%; }
.ltable td { padding: 8px 12px; border-bottom: 1px solid #EEF0F3; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }

/* ---------- reports ---------- */
/* reports page */
.rp-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 28px 0 22px; }
.rp-head h1, .rp-head h2 { font-size: clamp(28px, 4.6vw, 40px); font-weight: 600; line-height: 1.1; }
.rp-head p { color: var(--ink-2); font-size: 14px; margin-top: 8px; max-width: 520px; }
.rp-head .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.votes { display: flex; flex-direction: column; gap: 14px; }
.vcard { background: var(--surface); border-radius: var(--r); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; padding: 26px 30px; align-items: center; min-width: 0; }
.vcard .vl { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vcard .vr { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tag { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 3px 9px; }
.vcard h3 { font-size: 18px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
.vcard .by { font-size: 13px; color: var(--ink-2); }
.vcard .by a { color: var(--blue); }
.tally { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--chip); margin-top: 4px; }
.tally i { display: block; height: 100%; transition: width .5s ease; }
.c-agree { background: var(--blue); } .c-disagree { background: #E5484D; } .c-hold { background: #7B8596; }
.legend { display: flex; gap: 4px 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.seg { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 6px; }
.vbtn { background: var(--chip); border-radius: 999px; height: 40px; padding: 0 20px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; white-space: nowrap; }
.vbtn:hover:not(:disabled) { background: #DDE3EC; }
.vbtn svg { color: var(--blue); flex: none; }
.vote-note { font-size: 12px; color: var(--muted); }
.lib-tools { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 0 1px var(--line) inset; }
.chip:hover { color: var(--ink); }
.chip small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.chip[aria-pressed="true"] small { color: rgba(255,255,255,.7); }
.search { position: relative; flex: 0 1 240px; min-width: 180px; }
.search input { width: 100%; height: 36px; border-radius: 999px; border: 0; box-shadow: 0 0 0 1px var(--line) inset; background: var(--surface); padding: 0 14px 0 34px; font: inherit; font-size: 13px; }
.search input:focus { outline: 2px solid var(--blue); box-shadow: none; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.lib { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.rrow { display: grid; grid-template-columns: 170px minmax(0, 1fr) 190px 64px; gap: 20px; align-items: center; padding: 16px 24px; border-top: 1px solid var(--line); text-align: left; width: 100%; transition: background .12s; }
.rrow:first-child { border-top: 0; }

.rrow .go { font-size: 13px; font-weight: 600; color: var(--blue); justify-self: end; }
@media (max-width: 1100px) and (min-width: 861px) { .rrow, .lib-head { grid-template-columns: 150px minmax(0, 1fr) 150px 50px; gap: 16px; } }
.lib-head { display: grid; grid-template-columns: 170px minmax(0, 1fr) 190px 64px; gap: 20px; padding: 12px 24px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: #F7F9FC; border-bottom: 1px solid var(--line); }
.more { display: flex; justify-content: center; margin-top: 28px; }
.doc { aspect-ratio: 1; border-radius: 16px; background: var(--surface); overflow: hidden; position: relative; padding: 14% 10% 0; font-family: var(--serif); }
.doc::before { content: ""; position: absolute; top: 0; left: 10%; right: 0; height: 5px; background: var(--blue); border-radius: 0 0 0 4px; }
.doc .dt { font-size: 9.5px; font-weight: 600; line-height: 1.3; }
.doc .da { font-size: 7px; text-align: right; margin: 8px 0 10px; font-weight: 600; }
.doc i { display: block; height: 3px; background: #E3E6EB; border-radius: 2px; margin-bottom: 5px; }
.doc.cover { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; text-align: center; }
.doc.cover::before { display: none; }
.doc.cover .dt { color: #1F3A8A; font-weight: 400; font-size: 11px; }
.doc.cover .da { text-align: center; color: #1F3A8A; font-weight: 400; margin: 6px 0 0; }

.doc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }

/* ---------- funds ---------- */
.fund-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.fund-card { border-radius: var(--r); padding: 28px 26px; min-height: 240px; display: flex; flex-direction: column; background: var(--blue-soft); transition: transform .2s; }

.fund-card.dark { background: var(--blue); color: #fff; }
.fund-card .mgr { font-size: 12px; }
.fund-card h3 { font-size: 18px; font-weight: 600; margin-top: 10px; line-height: 1.3; }
.fund-card .ic { margin-top: auto; align-self: flex-end; font-size: 58px; line-height: 1; width: 72px; height: 72px; display: grid; place-items: center; }
.fund-card .ic img { width: 100%; height: 100%; object-fit: contain; }
.fund-hero { background: var(--blue); color: #fff; border-radius: var(--r); padding: 64px 84px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }

.fund-hero p { font-size: 13px; margin-top: 12px; }

.fund-body { max-width: none; }
.prose { background: var(--surface); border-radius: var(--r); padding: 32px 28px; display: flex; flex-direction: column; gap: 18px; font-size: 14.5px; color: var(--ink); }

.prose ul, .prose ol { margin: 6px 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.prose ul ul { margin-top: 4px; }
.prose a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.keys .prose { padding: 22px; font-size: 14px; gap: 10px; }
.fund-hero .totals { display: flex; gap: 28px; margin-top: 22px; flex-wrap: wrap; }
.fund-hero .totals div { display: flex; flex-direction: column; gap: 2px; }
.fund-hero .totals span { font-size: 11px; opacity: .75; text-transform: uppercase; letter-spacing: .06em; }
.fund-hero .totals b { font-size: 18px; font-weight: 600; }
.camp-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: -12px 0 22px; }
.stock-link { display: flex; flex-direction: column; min-width: 0; }
.stock-link .stock { flex: 1; transition: box-shadow .15s; }
.stock-link:hover .stock { box-shadow: 0 0 0 1.5px var(--blue) inset; }
.info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-top: 24px; }
.info-grid div { box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.stock-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.stock-head .logo-box { width: 56px; height: 56px; margin: 0; border-radius: 14px; font-size: 20px; }

.stock-head .logo-box.has-img img { height: 56px; max-width: 140px; }
.stock-head h1 { font-size: 30px; font-weight: 700; }
.stock-head .px { margin-left: auto; text-align: right; }
.stock-head .px b { font-size: 28px; font-weight: 700; display: block; }
.hold-wrap { background: var(--surface); border-radius: var(--r); padding: 28px; position: relative; }
.hold-wrap .stock-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); padding-right: 40px; }
.hold-wrap .refresh { top: 22px; right: 22px; }
.comp { background: var(--surface); border-radius: var(--r); padding: 36px 40px; display: grid; grid-template-columns: 300px minmax(0, 860px); justify-content: center; gap: 64px; align-items: center; }
.comp .ltable td + td { text-align: right; padding-right: 18px; } .comp .ltable th + th, .comp .ltable td + td { width: auto; }

/* ---------- page header (shared) ---------- */
.ph-head { margin: 28px 0 34px; max-width: 640px; }
.ph-head .eyebrow { color: var(--blue); font-weight: 600; font-size: 12px; }
.ph-head h1 { font-size: clamp(32px, 5.4vw, 46px); font-weight: 700; line-height: 1.08; margin-top: 10px; letter-spacing: -0.03em; }

.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 56px 0 18px; }
.sec-title h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.sec-title span { color: var(--muted); font-size: 13px; }

/* ---------- team ---------- */
.team-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 40px 24px; background: var(--surface); border-radius: var(--r); padding: 48px 32px 44px; }
@media (max-width: 860px) { .team-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .team-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 32px 16px; } }
.person { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.person .ph { width: min(160px, 100%); aspect-ratio: 1; border-radius: 50%; overflow: hidden; font-size: 34px; background: #E9EEF5; margin-bottom: 14px; box-shadow: 0 0 0 1px var(--line); }
.person .ph img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
.person h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.person p { font-size: 14px; color: var(--muted); line-height: 1.4; }
.mgr-list { background: var(--surface); border-radius: var(--r); padding: 6px 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; }

.mrow { display: flex; align-items: flex-start; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.mgr-list .mrow:last-child, .mgr-list .mrow:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
@media (max-width: 760px) { .mgr-list .mrow:nth-last-child(2):nth-child(odd) { border-bottom: 1px solid var(--line); } }
.mrow .avatar { width: 36px; height: 36px; font-size: 12px; background: var(--chip); color: var(--ink-2); flex: none; }
.mrow b { font-size: 15px; font-weight: 600; display: block; margin-bottom: 2px; }
.mrow a { display: block; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.mrow a:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- curriculum ---------- */
.course-hero { background: var(--blue); color: #fff; border-radius: var(--r); padding: 44px 44px 40px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin-top: 12px; }
.course-hero .eyebrow { opacity: .75; font-weight: 600; font-size: 12px; }

.course-hero p { margin-top: 14px; opacity: .85; white-space: pre-line; max-width: 560px; font-size: 15px; }
.course-hero .facts { display: flex; gap: 22px; font-size: 13px; }
.course-hero .facts b { display: block; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lessons { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.lesson { display: flex; align-items: center; gap: 16px; background: var(--surface); border-radius: 16px; padding: 16px 18px; font-size: 15px; transition: box-shadow .15s; }
.lesson:hover { box-shadow: 0 0 0 1.5px var(--blue) inset; }
.lesson .n { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.lesson:hover .n { background: var(--blue); color: #fff; }
.lesson .t { font-weight: 600; flex: 1; min-width: 0; }
.lesson .d { color: var(--muted); display: flex; align-items: center; gap: 14px; flex: none; font-size: 13px; }
.lesson .d span { display: inline-flex; align-items: center; gap: 5px; }
.course-card { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; }
.course-card h3 { font-size: 20px; font-weight: 600; white-space: pre-line; }
.course-card p { color: var(--ink-2); margin-top: 8px; font-size: 14px; }
.watch { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; margin-top: 8px; }
.player { aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; position: relative; display: grid; place-items: center; background: radial-gradient(120% 120% at 15% 10%, #2B63F0 0%, #0034BC 45%, #071E66 100%); color: #fff; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.player .cap { position: absolute; left: 28px; bottom: 24px; right: 28px; }
.player .cap span { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.player .cap b { display: block; font-size: clamp(20px, 3.4vw, 30px); font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.15; }
.player .play { width: 72px; height: 72px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .2s; }
.player .play svg { width: 28px; height: 28px; margin-left: 4px; }
.player .play:hover { transform: scale(1.06); }
.player .note { position: absolute; top: 18px; right: 20px; font-size: 12px; background: rgba(255,255,255,.15); border-radius: 999px; padding: 4px 10px; }
.lesson-info { background: var(--surface); border-radius: 20px; padding: 22px 24px; margin-top: 14px; }
.lesson-info .crumb { font-size: 13px; color: var(--muted); }
.lesson-info .crumb a { color: var(--blue); }
.lesson-info h1 { font-size: clamp(22px, 3.4vw, 28px); font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; }
.lesson-info .acts { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--chip); font-size: 13px; font-weight: 500; }
button.pill:hover, a.pill:hover { background: #DDE3EC; }
.likebtn[aria-pressed="true"] { background: #FDECEE; color: var(--gain); }
.likebtn[aria-pressed="true"] svg { fill: currentColor; }
.discuss { background: var(--surface); border-radius: 20px; padding: 22px 24px; margin-top: 14px; }
.discuss h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.discuss h2 span { color: var(--muted); font-weight: 500; margin-left: 6px; }
.composer { display: flex; gap: 12px; margin-top: 16px; align-items: flex-start; }
.composer .box { flex: 1; min-width: 0; border: 1px solid #C9CED6; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s; }
.composer .box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,62,221,.12); }
.composer textarea { border: 0; outline: 0; resize: none; font: inherit; font-size: 14px; min-height: 44px; background: transparent; }
.composer .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.composer .btn { height: 34px; padding: 0 16px; font-size: 13px; }
.comments { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.comments li { display: flex; gap: 12px; }
.comments .avatar { width: 36px; height: 36px; font-size: 12px; }
.comments .body { flex: 1; min-width: 0; font-size: 14px; }

.comments .body time { font-size: 12px; color: var(--muted); }
.comments .body p { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.comments .del { font-size: 12px; color: var(--muted); }
.comments .del:hover { color: var(--gain); }
.no-comments { color: var(--muted); font-size: 14px; margin-top: 18px; }
.playlist { background: var(--surface); border-radius: 20px; padding: 18px; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.playlist h3 { font-size: 15px; font-weight: 700; white-space: pre-line; line-height: 1.3; }
.playlist .sub { font-size: 12px; color: var(--muted); margin: 4px 0 12px; }

const mem = {};

/* ===================== charts ===================== */
function pie(items, { donut = false, size = 280 } = {}) {
  const total = items.reduce((a, b) => a + b.value, 0) || 1, r = size / 2, cx = r, cy = r;
  let a0 = -Math.PI / 2, out = "";
  items.forEach((it, i) => {
    const frac = it.value / total, a1 = a0 + frac * Math.PI * 2;
    const col = it.color || PIE_COLORS[i % PIE_COLORS.length];
    if (frac >= 0.9999) out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}"/>`;
    else {
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      out += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${frac > .5 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${col}" stroke="#fff" stroke-width="1.5"><title>${esc(it.label)}: ${Math.round(frac * 100)}%</title></path>`;
    }
    a0 = a1;
  });
  if (donut) out += `<circle cx="${cx}" cy="${cy}" r="${r * .3}" fill="#fff"/>`;
  return `<svg class="pie" viewBox="0 0 ${size} ${size}" role="img" aria-label="Allocation chart">${out}</svg>`;
}
function group(holdings, key) {
  const m = new Map();
  holdings.forEach(h => m.set(h[key], (m.get(h[key]) || 0) + h.weight));
  return [...m].map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
}
function allocBlock(title, items, head) {
  const rows = items.map((it, i) => `<tr><td><span class="sw" style="background:${PIE_COLORS[i % PIE_COLORS.length]}"></span>${esc(it.label)}</td><td class="num">${Math.round(it.value)}%</td></tr>`).join("");
  return `<div class="alloc"><h3>${title}</h3><div class="alloc-row">${pie(items)}<div style="overflow-x:auto"><table class="ltable"><thead><tr><th>${head}</th><th>Percentage</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
}

function voteCard(v) {

  const when = ended ? "Voting closed" : days === 0 ? "Closes today" : `Closes ${end.toLocaleDateString("en-US", { month: "short", day: "numeric" })} · ${days} day${days === 1 ? "" : "s"} left`;

    <div class="legal"><nav aria-label="Legal pages"><a href="#terms" aria-current="${which === "terms" ? "page" : "false"}">Terms of Service</a><a href="#privacy" aria-current="${which === "privacy" ? "page" : "false"}">Privacy Policy</a></nav>
    <article class="doc-body">${body}</article></div>`;
};

V.notfound = () => `<div class="empty" style="margin-top:40px"><strong>Page not found</strong><a href="#home" style="color:var(--blue)">Go to the home page</a></div>`;

/* ===================== router ===================== */
/* Internal route ids look like "campaign-amazon-injuries". In clean mode they map to real paths (campaigns/amazon-injuries/). */
const CLEAN = !!window.YIF_CLEAN && /^https?:$/.test(location.protocol);
const SIMPLE = ["about", "team", "curriculum", "portfolio", "reports", "campaigns", "login", "signup", "privacy", "terms"];
function toPath(id) {
  let m;
  if (!id || id === "home") return "";
  if (SIMPLE.includes(id)) return id + "/";
  if (id === "fund") return "funds/";
  if ((m = id.match(/^fund-(.+)$/))) return `funds/${m[1]}/`;
  if ((m = id.match(/^campaign-(.+)$/))) return `campaigns/${m[1]}/`;
  if ((m = id.match(/^lesson-(.+)-(\d+)$/))) return `curriculum/${m[1]}/${m[2]}/`;
  if ((m = id.match(/^course-(.+)$/))) return `curriculum/${m[1]}/`;
  if ((m = id.match(/^stock-(.+)$/))) return `portfolio/${m[1]}/`;
  return id + "/";
}
function fromPath(p) {
  const seg = p.split("/").filter(Boolean).map(decodeURIComponent);
  if (!seg.length) return "home";
  const [a, b, c] = seg;
  if (a === "funds") return b ? "fund-" + b : "fund";
  if (a === "campaigns" && b) return "campaign-" + b;
  if (a === "curriculum" && b) return c ? `lesson-${b}-${c}` : "course-" + b;
  if (a === "portfolio" && b) return "stock-" + b;
  return a;
}
const basePath = () => new URL(document.baseURI).pathname;
function currentId() {
  if (!CLEAN) return (location.hash || "#home").slice(1) || "home";
  let p = location.pathname; const b = basePath();
  if (p.startsWith(b)) p = p.slice(b.length);
  return fromPath(p.replace(/index\.html$/, ""));
}
const linkFor = id => CLEAN ? new URL(toPath(id), document.baseURI).pathname : "#" + id;
function go(id, replace) {
  if (!CLEAN) { if (location.hash.slice(1) === id) route(); else location.hash = "#" + id; return; }
  history[replace ? "replaceState" : "pushState"](null, "", linkFor(id));
  route(); if (!replace) scrollTo(0, 0);
}
function fixLinks(root = document) {
  if (!CLEAN) return;
  root.querySelectorAll('a[href^="#"]').forEach(a => { const id = a.getAttribute("href").slice(1); if (id) a.setAttribute("href", linkFor(id)); });
}
function route() {
  const h = currentId();
  let html, after = "", nav = h.split("-")[0];
  let m;
  if (h === "home" || h === "") html = V.home();
  else if (h === "about") html = V.about();
  else if (h === "team") html = V.team();
  else if (h === "campaigns") html = V.campaigns();
  else if ((m = h.match(/^campaign-(.+)$/))) { html = V.campaign(m[1]); nav = "campaigns"; }
  else if (h === "curriculum") html = V.curriculum();
  else if ((m = h.match(/^course-(.+)$/))) { html = V.course(m[1]); nav = "curriculum"; }
  else if ((m = h.match(/^lesson-(.+)-(\d+)$/))) { html = V.lesson(m[1], +m[2]); nav = "curriculum"; }
  else if (h === "fund") html = V.fund();
  else if ((m = h.match(/^fund-(.+)$/))) { html = V.fundDetail(m[1]); nav = "fund"; }
  else if (h === "portfolio") html = V.portfolio();
  else if ((m = h.match(/^stock-(.+)$/))) { html = V.stock(decodeURIComponent(m[1])); nav = "portfolio"; }
  else if (h === "reports") html = V.reports();
  else if (h === "login" || h === "signup") html = V.login(h);
  else if (h === "privacy" || h === "terms") html = V.legal(h);
  else html = V.notfound();

  const app = $("#app");
  app.innerHTML = html;
  fixLinks(app);
  document.querySelectorAll(".after-main").forEach(e => e.remove());
  if (after) { const d = document.createElement("div"); d.className = "after-main"; d.innerHTML = after; app.after(d); app.style.paddingBottom = "0"; }
  else app.style.paddingBottom = "";
  document.querySelectorAll("#menu a").forEach(a => { if (a.dataset.k === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  setMenu(false);
  const t = S.site.brand.name;
  const extra = { privacy: "Privacy Policy", terms: "Terms of Service", login: "Log In", signup: "Sign Up" };
  let mm, detail = null;
  if ((mm = h.match(/^campaign-(.+)$/))) detail = S.site.campaigns.find(c => c.id === mm[1])?.title;
  else if ((mm = h.match(/^fund-(.+)$/))) detail = S.site.funds.find(f => f.slug === mm[1])?.name;
  else if ((mm = h.match(/^stock-(.+)$/))) { const x = S.port.holdings.find(k => k.symbol === mm[1]); detail = x && `${x.symbol} · ${x.name}`; }
  else if ((mm = h.match(/^lesson-(.+)-(\d+)$/))) detail = S.site.curriculum.find(c => c.slug === mm[1])?.lessons[mm[2] - 1]?.title;
  else if ((mm = h.match(/^course-(.+)$/))) detail = S.site.curriculum.find(c => c.slug === mm[1])?.title.replace(/\n/g, " ");
  const label = detail || (h === "fund" ? "Funds" : NAV.find(n => n[0] === nav)?.[1]) || extra[h] || (html === V.notfound() ? "Page not found" : "Page");
  document.title = h === "home" || !h ? t : label + " · " + t;
}
function rerender() {
  const y = scrollY, vals = {}, act = document.activeElement?.id;
  const checks = {};
  document.querySelectorAll("#app input[id], #app textarea[id]").forEach(i => { if (i.type === "checkbox") checks[i.id] = i.checked; else if (i.value) vals[i.id] = i.value; });
  route();
  Object.entries(vals).forEach(([id, v]) => { const i = document.getElementById(id); if (i && i.type !== "password") i.value = v; });
  Object.entries(checks).forEach(([id, v]) => { const i = document.getElementById(id); if (i) i.checked = v; });
  if (act) document.getElementById(act)?.focus({ preventScroll: true });
  scrollTo(0, y);
}

/* ===================== events ===================== */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, B = S.site.brand;
  if (act === "refresh") {
    e.preventDefault(); el.classList.add("spin");
    await loadPrices(); rerender();
    toast("Prices as of " + new Date(S.prices.updated).toLocaleString("en-US", { month: "2-digit", day: "2-digit", year: "numeric", hour: "numeric", minute: "2-digit" }));
  } else if (act === "filter") {
    S.reportFilter = el.dataset.cat || null; S.reportLimit = 20; rerender();
  } else if (act === "psort") { S.portSort = el.dataset.k; rerender();
  } else if (act === "atab") { S.allocTab = el.dataset.k; rerender();
  } else if (act === "goStock") { go("stock-" + el.dataset.sym);
  } else if (act === "more") {
    S.reportLimit += 20; rerender();
  } else if (act === "report") {
    const r = S.site.reports.find(x => x.id === el.dataset.id);
    if (r?.file) { e.preventDefault(); window.open(r.file, "_blank", "noopener"); }
    else if (el.tagName === "BUTTON") toast("This report's PDF hasn't been uploaded yet.");
  } else if (act === "vote") {
    if (!requireLogin("Log in to vote on reports.")) return;
    const key = "vote:" + el.dataset.id + ":" + DB.user.uid, prev = L[key]?.mine || null;
    if (prev === el.dataset.choice) { toast("That's already your vote. Pick another option to change it."); return; }
    el.disabled = true;
    try { await DB.vote(el.dataset.id, el.dataset.choice, prev); toast(prev ? "Vote changed." : "Vote recorded."); }
    catch (err) { toast(err instanceof AuthError ? err.message : "Couldn't save your vote. Try again."); }
    drop("vote:" + el.dataset.id + ":" + DB.user.uid); rerender();
  } else if (act === "like") {
    if (!requireLogin("Log in to like lessons.")) return;
    const k = "lk:" + el.dataset.id + ":" + DB.user.uid, cur = L[k];
    const on = !(cur?.mine);
    L[k] = { count: (cur?.count || 0) + (on ? 1 : -1), mine: on }; rerender();
    try { await DB.toggleLike(el.dataset.id, on); } catch { toast("Couldn't save your like."); }
    drop(k); rerender();
  } else if (act === "delComment") {
    try { await DB.deleteComment(el.dataset.lid, el.dataset.id); toast("Comment deleted."); } catch { toast("Couldn't delete the comment."); }
    drop("cm:" + el.dataset.lid); rerender();
  } else if (act === "toSign") {
    $("#sign")?.scrollIntoView({ behavior: "smooth", block: "center" }); setTimeout(() => $("#sgName")?.focus({ preventScroll: true }), 400);
  } else if (act === "google") {
    const msg = $("#authMsg"); msg.hidden = true;
    if ($("#agree") && !$("#agree").checked) { needConsent(msg); return; }
    try { await DB.google(); afterAuth("Logged in with Google."); } catch (err) { msg.className = "msg error"; msg.textContent = err.message; msg.hidden = false; }
  } else if (act === "reset") {
    const msg = $("#authMsg");
    try { await DB.reset($("#em").value.trim()); msg.className = "msg ok"; msg.textContent = "Check your inbox for a link to reset your password."; }
    catch (err) { msg.className = "msg error"; msg.textContent = err.message; }
    msg.hidden = false;
  } else if (act === "acct") {
    const m = $("#acctMenu"); m.hidden = !m.hidden; el.setAttribute("aria-expanded", !m.hidden);
  } else if (act === "profile") {
    const m = $("#acctMenu"); if (m) m.hidden = true; setMenu(false); openProfile();
  } else if (act === "closeProfile") { closeProfile();
  } else if (act === "profileDelete") { openProfile("delete");
  } else if (act === "profileBack") { openProfile("main");
  } else if (act === "logout") {
    closeProfile(true);
    await DB.logOut(); toast("You're logged out.");
  }
  else if (act === "login" && B.loginUrl) { e.preventDefault(); location.href = B.loginUrl; }
  else if (act === "signup" && B.signupUrl) { e.preventDefault(); location.href = B.signupUrl; }
  else if (act === "play") {
    const p = $("#player"), src = p.dataset.video;
    if (!src) return toast("This lesson's video link hasn't been added yet.");
    p.innerHTML = `<iframe src="${esc(src)}" title="Lesson video" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  }
});
document.addEventListener("click", e => {
  if (e.target.closest("#menu a")) setMenu(false);
  const m = $("#acctMenu"); if (m && !m.hidden && !e.target.closest(".acct")) { m.hidden = true; $(".acct-btn")?.setAttribute("aria-expanded", "false"); }
});
function needConsent(msg) {
  msg.className = "msg error"; msg.textContent = "Please agree to the Terms of Service and Privacy Policy to continue."; msg.hidden = false;
  const w = $("#consentWrap") || $("#signConsent"); if (w) { w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); }
  $("#agree, #sgAgree")?.focus();
}
function afterAuth(msg) {
  toast(msg); const to = S.returnTo && !/^(login|signup)$/.test(S.returnTo) ? S.returnTo : "home"; S.returnTo = null;
  if (currentId() === to) rerender(); else go(to);
}
document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  const act = f.dataset.act;
  if (act === "comment") {
    if (!requireLogin("Log in to comment.")) return;
    const inp = f.querySelector("textarea, input"), text = inp.value.trim(); if (!text) return;
    inp.disabled = true;
    try { await DB.addComment(f.dataset.id, text); inp.value = ""; } catch { toast("Couldn't post your comment. Try again."); }
    inp.disabled = false; drop("cm:" + f.dataset.id); rerender();
  } else if (act === "saveName") {
    const msg = $("#pfMsg"), btn = $("#pfSave"), v = $("#pfName").value;
    btn.disabled = true; btn.textContent = "Saving…";
    try { await DB.updateName(v); msg.className = "msg ok"; msg.textContent = "Your name has been updated."; $("#pfTitle").textContent = DB.user.name; $("#pfAv").textContent = initials(DB.user.name); }
    catch (err) { msg.className = "msg error"; msg.textContent = err.message; }
    msg.hidden = false; btn.disabled = false; btn.textContent = "Save changes";
  } else if (act === "confirmDelete") {
    const msg = $("#pfDelMsg"), btn = $("#pfDel");
    msg.hidden = true; btn.disabled = true; btn.textContent = "Deleting…";
    try { await DB.deleteAccount($("#pfPw")?.value); closeProfile(true); toast("Your account has been deleted."); if (/^(login|signup)$/.test(currentId())) rerender(); }
    catch (err) { msg.textContent = err.message; msg.hidden = false; btn.disabled = false; btn.textContent = "Delete my account"; }
  } else if (act === "auth") {
    const msg = $("#authMsg"), btn = $("#authBtn"), up = f.dataset.mode === "signup";
    msg.hidden = true;
    if (up && !$("#agree").checked) { needConsent(msg); return; }
    btn.disabled = true; btn.textContent = up ? "Creating account…" : "Logging in…";
    try {
      const em = $("#em").value.trim(), pw = $("#pw").value;
      if (up) await DB.signUp($("#nm").value.trim(), em, pw); else await DB.logIn(em, pw);
      afterAuth(up ? "Welcome to Youth Impact Fund!" : "Welcome back!");
    } catch (err) {
      msg.className = "msg error"; msg.textContent = err.message; msg.hidden = false;
      btn.disabled = false; btn.textContent = up ? "Create account" : "Log In";
    }
  } else if (act === "sign") {
    const cid = f.dataset.id, name = $("#sgName").value.trim(), email = $("#sgEmail").value.trim(), msg = $("#signMsg"), btn = $("#signBtn");
    const fail = t => { msg.textContent = t; msg.hidden = false; };
    msg.hidden = true;
    if (!name) return fail("Enter your full name.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail("Enter a valid email address.");
    if (!$("#sgAgree").checked) { const w = $("#signConsent"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); return fail("Please agree to the Terms of Service and Privacy Policy to sign."); }
    btn.disabled = true; btn.textContent = "Adding your signature…";
    try {
      await DB.sign(cid, name, email);
      store.set("yif:signed:" + cid, name);
      L["pet:" + cid] = (L["pet:" + cid] || 0) + 1; rerender();
      $("#signNum")?.classList.add("pop"); toast("Thank you for signing!");
      setTimeout(() => DB.petitionCount(cid).then(v => { L["pet:" + cid] = v; rerender(); }).catch(() => {}), 1500);
    } catch (err) {
      fail(err instanceof AuthError ? err.message : "Couldn't add your signature. Check your connection and try again.");
      btn.disabled = false; btn.textContent = "Sign this petition";
    }
  }
});
document.addEventListener("keydown", e => {
  const m = $("#profileModal");
  if (m && e.key === "Tab") {
    const f = [...m.querySelectorAll("button, input:not([readonly]), a[href]")].filter(x => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "cmt" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "rq") return;
  S.reportQuery = e.target.value; S.reportLimit = 20;
  clearTimeout(S.qt); S.qt = setTimeout(rerender, 150);
});
function setMenu(open) {
  $("#menu").classList.toggle("open", open); document.body.classList.toggle("menu-open", open);
  const b = $("#burger"); b.setAttribute("aria-expanded", open); b.setAttribute("aria-label", open ? "Close menu" : "Open menu");
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#profileModal")) { closeProfile(); return; }
  if ($("#menu").classList.contains("open")) { setMenu(false); $("#burger").focus(); }
});
window.matchMedia("(min-width: 901px)").addEventListener?.("change", e => { if (e.matches) setMenu(false); });
$("#burger").addEventListener("click", () => {
  setMenu(!$("#menu").classList.contains("open"));
});
window.addEventListener("hashchange", () => {
  if (CLEAN) { const id = location.hash.slice(1); if (id && !document.getElementById(id)) go(id, true); return; }
  route(); scrollTo(0, 0);
});
window.addEventListener("popstate", () => { if (CLEAN) route(); });
document.addEventListener("click", e => {
  if (!CLEAN || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest("a[href]"); if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
  const u = new URL(a.href, location.href); if (u.origin !== location.origin || !u.pathname.startsWith(basePath())) return;
  if (/\.(pdf|json|png|jpe?g|webp|svg|xml|txt|ico)$/i.test(u.pathname)) return;
  e.preventDefault();
  const id = fromPath(u.pathname.slice(basePath().length));
  if (u.pathname === location.pathname) { setMenu(false); scrollTo({ top: 0, behavior: "smooth" }); return; }
  go(id);
}, true);

/* ===================== boot ===================== */
(async () => {
  try {
    [S.site, S.port] = await Promise.all([getJSON("data/site.json"), getJSON("data/portfolio.json")]);
    await Promise.all([loadPrices(), DB.init()]);
  } catch (err) {
    $("#app").innerHTML = `<div class="empty" style="margin-top:40px"><strong>Couldn't load site data</strong>${esc(err.message)}. If you opened index.html directly from your computer, run a local server instead (see README).</div>`;
    return;
  }
  const cost = S.port.holdings.reduce((a, h) => a + h.purchase * (h.shares || 0), 0);
  S.port.holdings.forEach(h => { if (h.weight == null) h.weight = cost ? h.purchase * h.shares / cost * 100 : 0; });
  const B = S.site.brand;
  $("#brand").innerHTML = (B.logo ? `<img src="${esc(B.logo)}" alt="">` : LOGO_SVG) + `<span>${esc(B.name).replace(" Fund", "<br>Fund")}</span>`;
  $("#menu").innerHTML = NAV.map(([k, l]) => `<a href="#${k}" data-k="${k}">${l}</a>`).join("") + `<div class="menu-acct" id="menuAcct"></div>`;
  renderAccount();
  DB.onChange(() => { renderAccount(); Object.keys(L).filter(k => /^(vote|lk):/.test(k)).forEach(k => delete L[k]); rerender(); });
  const col = (t, items) => `<div class="foot-col"><h4>${t}</h4><ul>${items.map(([k, l]) => `<li><a href="#${k}">${l}</a></li>`).join("")}</ul></div>`;
  $("#footer").innerHTML = `<div class="foot-top">
      <div class="foot-brand"><a class="logo" href="#home">${B.logo ? `<img src="${esc(B.logo)}" alt="">` : LOGO_SVG}<span>${esc(B.name)}</span></a><p>${esc(B.tagline)} The world's first student-run ESG fund, founded in 2020.</p></div>
      ${col("Explore", [["about", "About"], ["team", "Team"], ["curriculum", "Curriculum"]])}
      ${col("Invest", [["fund", "Funds"], ["portfolio", "Portfolio"], ["reports", "Reports"]])}
      ${col("Act", [["campaigns", "Campaigns"], ["signup", "Sign Up"], ["login", "Log In"]])}
    </div>
    <div class="foot-bottom"><span>${esc(B.footer.join(" · "))}</span><span class="foot-legal"><a href="#terms">Terms of Service</a><a href="#privacy">Privacy Policy</a></span></div>`;
  if (CLEAN && location.hash.length > 1) { const old = location.hash.slice(1); history.replaceState(null, "", linkFor(old)); }
  fixLinks(document);
  route();
  setInterval(async () => {
    if (document.hidden) return;
    const before = S.prices.updated; await loadPrices();
    if (S.prices.updated !== before && !document.activeElement?.matches("input")) rerender();
  }, 5 * 60 * 1000);
})();
})();
