name: Update stock prices

on:
  schedule:
    - cron: "7 0-7 * * 1-5"    # every hour during Korean market hours (UTC)
    - cron: "7 14-21 * * 1-5"  # every hour during US market hours (UTC)
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python scripts/update_prices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update stock prices"
            git push
          fi
